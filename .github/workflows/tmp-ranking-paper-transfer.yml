name: tmp-ranking-paper-transfer
on:
  push:
    paths:
      - '.github/workflows/tmp-ranking-paper-transfer.yml'
  workflow_dispatch:

jobs:
  download-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate missing papers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p papers
          curl -A 'Mozilla/5.0 paper-archiver/1.0' -L --fail --retry 5 --retry-delay 2 --retry-all-errors \
            -o papers/2020_PLE_Progressive_Layered_Extraction.pdf \
            'https://raw.githubusercontent.com/madkay/paper/master/2020%20%28Tencent%29%20%28Recsys%29%20%5BPLE%5D%20Progressive%20Layered%20Extraction%20%28PLE%29%20-%20A%20Novel%20Multi-Task%20Learning%20%28MTL%29%20Model%20for%20Personalized%20Recommendations.pdf'
          curl -A 'Mozilla/5.0 paper-archiver/1.0' -L --fail --retry 5 --retry-delay 2 --retry-all-errors \
            -o papers/2024_HSTU_Actions_Speak_Louder_than_Words.pdf \
            'https://arxiv.org/pdf/2402.17152'
          for f in papers/*.pdf; do
            test "$(head -c 5 "$f")" = '%PDF-'
            file "$f"
            ls -lh "$f"
          done
      - name: Upload missing papers
        uses: actions/upload-artifact@v4
        with:
          name: ranking-papers-missing-two
          path: papers/*.pdf
          if-no-files-found: error
          retention-days: 3
